[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/session",
    "crates/skills",
    "crates/extensions",
    "crates/channels",
    "crates/sonda",
    "desktop/cli",
    "desktop/client/src-tauri",
    "desktop/server",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
moray-core = { path = "crates/core" }
moray-session = { path = "crates/session" }
moray-skills = { path = "crates/skills" }
moray-extensions = { path = "crates/extensions" }
moray-channels = { path = "crates/channels" }
moray-sonda = { path = "crates/sonda" }
moray-desktop-server = { path = "desktop/server" }
moray-cli = { path = "desktop/cli" }
