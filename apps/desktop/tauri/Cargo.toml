[package]
name = "Moray"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "moray_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Enable this feature to build zeroclaw CLI sidecar and bundle it into the app.
# When enabled, build.rs will:
#   1. Build zeroclaw CLI for the same target architecture
#   2. Copy the binary into binaries/ with Tauri sidecar naming convention
zeroclaw-sidecar = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
