[package]
name = "moray-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Moray agent core: chat-completion trait, toolbox, ReAct state machine, recoverable events"

[features]
default = ["serde"]
serde = []

[dependencies]
async-trait = "0.1.88"
futures = "0.3.31"
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["macros", "rt-multi-thread", "sync"] }
tokio-util = "0.7"
tracing = "0.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
