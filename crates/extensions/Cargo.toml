[package]
name = "nova-extensions"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Nova extension trait implementations and built-in tools"

[features]
default = ["serde"]
serde = ["dep:serde", "nova-core/serde"]

[dependencies]
async-openai = { git = "https://git.woa.com/yuanbao-multimodal/async-openai.git", rev = "78d5540", features = ["chat-completion"] }
async-stream = "0.3.6"
async-trait = "0.1.88"
futures = "0.3.31"
nova-core.workspace = true
serde = { version = "1.0.219", features = ["derive"], optional = true }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["sync", "rt", "macros", "fs", "process", "time"] }
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
