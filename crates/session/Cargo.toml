[package]
name = "moray-session"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Moray recoverable session domain: events, runtime, and harness wiring"

[features]
default = ["serde"]
serde = ["dep:serde", "moray-core/serde"]

[dependencies]
futures = "0.3.31"
moray-core.workspace = true
serde = { version = "1.0.219", features = ["derive"], optional = true }
tokio = { version = "1.44.2", features = ["rt", "sync"] }
tokio-util = "0.7"
thiserror = "2.0.12"
