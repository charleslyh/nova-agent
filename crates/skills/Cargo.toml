[package]
name = "moray-skills"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Agent skills: types, local catalog, SkillHub client, and SkillsManager"

[dependencies]
hex = "0.4"
reqwest = { version = "0.12.15", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10"
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["sync", "rt", "macros"] }
toml = "0.8"
tracing = "0.1"
urlencoding = "2.1"
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
