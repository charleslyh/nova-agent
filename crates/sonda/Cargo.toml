[package]
name = "moray-sonda"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Moray Sonda application kit: TOML config and multi-agent assembly"

[dependencies]
moray-extensions.workspace = true
moray-channels.workspace = true
moray-skillhub.workspace = true
moray-core.workspace = true
moray-session.workspace = true
parking_lot = "0.12.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["sync", "rt", "macros", "fs"] }
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
dashmap = "6.1.0"
tracing = "0.1"
tokio-util = "0.7"

[dev-dependencies]
tempfile = "3"
moray-extensions.workspace = true
tokio = { version = "1.44.2", features = ["rt", "macros"] }
async-trait = "0.1.88"
serde_json = "1.0.140"
