[package]
name = "moray-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Moray CLI sidecar for direct tool invocation"
default-run = "moray-cli"

[[bin]]
name = "moray-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.98"
async-trait = "0.1.88"
clap = { version = "4.5.39", features = ["derive"] }
moray-extensions.workspace = true
moray-core.workspace = true
moray-sonda.workspace = true
serde_json = "1.0.140"
tokio = { version = "1.44.2", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
async-trait = "0.1.88"
