# Built-in tool manifests (description + JSON Schema parameters).
# Shipped as a Tauri resource; desktop server and moray-cli (via shell) load this file.

[[tools]]
name = "calc"
label = "计算器"
description = """
Evaluate arithmetic expressions with + - * /, parentheses, unary +/- and functions like sqrt/pow/max/min.
"""
parameters = """
{
  "type": "object",
  "properties": {
    "expression": { "type": "string" }
  },
  "required": ["expression"]
}
"""

[[tools]]
name = "shell"
label = "Shell"
description = """
Execute a shell command in the current working directory.
"""
parameters = """
{
  "type": "object",
  "properties": {
    "command": { "type": "string" }
  },
  "required": ["command"]
}
"""

[[tools]]
name = "file_read"
label = "读取文件"
description = """
Read file contents with optional offset and limit.
"""
parameters = """
{
  "type": "object",
  "properties": {
    "path": { "type": "string" },
    "offset": { "type": "integer" },
    "limit": { "type": "integer", "minimum": 1 }
  },
  "required": ["path"]
}
"""

[[tools]]
name = "file_write"
label = "写入文件"
description = """
Write text content to a file path.
"""
parameters = """
{
  "type": "object",
  "properties": {
    "path": { "type": "string" },
    "content": { "type": "string" }
  },
  "required": ["path", "content"]
}
"""

[[tools]]
name = "web_fetch"
label = "网页抓取"
description = """
Fetch a URL and return readable text content.
"""
parameters = """
{
  "type": "object",
  "properties": {
    "url": { "type": "string" }
  },
  "required": ["url"]
}
"""

[[tools]]
name = "web_search"
label = "网页搜索"
description = """
Search engine providing web search and data retrieval capabilities.
"""
parameters = """
{
  "type": "object",
  "properties": {
    "query": { "type": "string" }
  },
  "required": ["query"]
}
"""

[[tools]]
name = "image_create"
label = "AI 绘图"
description = """
Text-to-image: generate a new image from a natural-language prompt.
Use only when the user explicitly asks for AI-generated artwork (e.g. draw, illustrate, text-to-image).
Not for image understanding or editing, general Q&A, or charts and plots.
"""
parameters = """
{
  "type": "object",
  "properties": {
    "query": {
      "type": "string",
      "description": "Prompt describing what to generate (style, subject, composition, colors, etc.)"
    },
    "aspect_ratio": {
      "type": "string",
      "description": "Output aspect ratio. Default 1:1. Allowed: 1:1, 9:16, 16:9, 3:4, 4:3, 2:3, 3:2, 4:5, 5:4, 9:21, 21:9",
      "default": "1:1"
    }
  },
  "required": ["query"],
  "additionalProperties": false
}
"""

[[tools]]
name = "image_edit"
label = "AI 图片编辑"
description = """
Edit an existing image: style transfer, image-to-image, and other modifications from a natural-language instruction.
Use only when the user wants to change an existing image (not text-to-image generation or image understanding).
Requires prompt and image_uri (HTTPS URL with full signature params, or a local/session-relative file path)."""
parameters = """
{
  "type": "object",
  "properties": {
    "prompt": {
      "type": "string",
      "description": "Editing instruction (e.g. change background to starry sky, convert to watercolor)"
    },
    "image_uri": {
      "type": "string",
      "description": "Source image: https URL (include full signature query params) or local file path"
    }
  },
  "required": ["prompt", "image_uri"],
  "additionalProperties": false
}
"""
