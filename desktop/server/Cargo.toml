[package]
name = "moray-desktop-server"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = "0.1.88"
async-stream = "0.3.6"
axum = "0.8.4"
futures = "0.3.31"
getrandom = "0.2"
moray-extensions.workspace = true
moray-channels.workspace = true
moray-sonda.workspace = true
moray-skills.workspace = true
moray-core.workspace = true
moray-session.workspace = true
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tracing = "0.1"
tokio = { version = "1.44.2", features = ["rt", "macros", "net", "time", "rt-multi-thread"] }
tokio-util = "0.7.15"
tower-http = { version = "0.6.2", features = ["cors"] }
